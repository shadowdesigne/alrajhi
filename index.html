<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>عرض البروفايل الاحترافي</title>
    
    <!-- Open Graph (OG) Tags لتحسين الظهور على واتساب وسوشيال ميديا -->
    <meta property="og:title" content="بروفايل شركة شدو ديزاين">
    <meta property="og:description" content="عرض تفاعلي لسابقة أعمالنا وتصاميمنا الإبداعية">
    <meta property="og:image" content="https://shadowdesign.sa/og.jpg">
    <meta property="og:image:alt" content="شعار شركة شدو ديزاين">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="513">
    <meta property="og:image:height" content="513">
    <meta property="og:url" content="https://shadowdesign.sa/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="بروفايل شركة شدو ديزاين">
    <meta name="twitter:description" content="عرض تفاعلي لسابقة أعمالنا وتصاميمنا الإبداعية">
    <meta name="twitter:image" content="https://shadowdesign.sa/og.jpg">
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="og.jpg">
    <link rel="apple-touch-icon" href="og.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --accent-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Almarai', sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000000; /* أسود داكن سادة */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: none; /* إخفاء الماوس الافتراضي */
        }

        /* مؤشر الماوس المخصص */
        #custom-cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference; /* يجعل اللون يتغير حسب الخلفية لضمان الرؤية */
            transition: transform 0.1s ease-out;
            transform: translate(-50%, -50%);
        }

        .footer {
            position: fixed;
            bottom: 2vh;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1000;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            pointer-events: auto;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-weight: bold;
        }

        .settings-toggle {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        .settings-toggle svg { width: 20px; height: 20px; fill: #000; }

        .settings-panel {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 25px 25px 0 0;
            padding: 25px;
            z-index: 2100;
            transition: bottom 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.7);
            text-align: right;
            color: #000;
        }
        .settings-panel.active { bottom: 0; }
        .setting-item { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }

        /* تحسين أزرار التنقل (Glassmorphism Premium) */
        .nav-controls {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 1500;
            pointer-events: none;
        }
        .nav-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 28px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1) translateZ(20px);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .scene {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 3000px;
            position: relative;
        }
        .book { position: relative; transform-style: preserve-3d; }
        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            will-change: transform;
        }
        .page-face {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 0;
            overflow: hidden;
            background: #fff;
            box-shadow: none;
        }
        .page-face img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
        .page-face.back {
            transform: rotateY(180deg);
            background: linear-gradient(90deg, rgba(0,0,0,0.12), transparent 14%), #f8f7f3;
        }

        .curl-lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(110deg, rgba(0,0,0,0.32), rgba(255,255,255,0.42) 42%, rgba(0,0,0,0.2));
            z-index: 2;
        }
        .spine-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 60px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.22), transparent);
            z-index: 3;
            pointer-events: none;
        }

        @keyframes realisticFlip {
            0% { transform: rotateY(0deg); }
            18% { transform: rotateY(-22deg); }
            52% { transform: rotateY(-102deg); }
            82% { transform: rotateY(-158deg); }
            100% { transform: rotateY(-180deg); }
        }
        @keyframes realisticFlipBack {
            0% { transform: rotateY(-180deg); }
            18% { transform: rotateY(-158deg); }
            52% { transform: rotateY(-78deg); }
            82% { transform: rotateY(-22deg); }
            100% { transform: rotateY(0deg); }
        }
        @keyframes classicFlip {
            from { transform: rotateY(0); }
            to { transform: rotateY(-180deg); }
        }
        @keyframes classicFlipBack {
            from { transform: rotateY(-180deg); }
            to { transform: rotateY(0); }
        }
        @keyframes slideFlip {
            from { transform: translateX(0) rotateY(0); opacity: 1; }
            to { transform: translateX(-100%) rotateY(-8deg); opacity: 0; }
        }
        @keyframes slideFlipBack {
            from { transform: translateX(-100%) rotateY(-8deg); opacity: 0; }
            to { transform: translateX(0) rotateY(0); opacity: 1; }
        }
        @keyframes fadeFlip {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.97); opacity: 0; }
        }
        @keyframes fadeFlipBack {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes quickFlip {
            0% { transform: rotateY(0); }
            65% { transform: rotateY(-195deg); }
            100% { transform: rotateY(-180deg); }
        }
        @keyframes quickFlipBack {
            0% { transform: rotateY(-180deg); }
            35% { transform: rotateY(15deg); }
            100% { transform: rotateY(0); }
        }

        .page.flipping,
        .page.flipping-back,
        .page.rewinding {
            animation-fill-mode: forwards;
            backface-visibility: visible;
        }
        .page.flipping .curl-lighting,
        .page.flipping-back .curl-lighting {
            animation: curlLight var(--flip-duration, 1.2s) ease-in-out forwards;
        }
        @keyframes curlLight {
            0%, 100% { opacity: 0; }
            38%, 62% { opacity: 0.8; }
        }
        #myBook[data-flip-style="realistic"] .page.flipping {
            animation: realisticFlip var(--flip-duration, 1.2s) cubic-bezier(0.42, 0, 0.18, 1) forwards;
        }
        #myBook[data-flip-style="realistic"] .page.flipping-back {
            animation: realisticFlipBack var(--flip-duration, 1.2s) cubic-bezier(0.42, 0, 0.18, 1) forwards;
        }
        #myBook[data-flip-style="classic"] .page.flipping {
            animation: classicFlip var(--flip-duration, 1s) cubic-bezier(0.55, 0.08, 0.25, 1) forwards;
        }
        #myBook[data-flip-style="classic"] .page.flipping-back {
            animation: classicFlipBack var(--flip-duration, 1s) cubic-bezier(0.55, 0.08, 0.25, 1) forwards;
        }
        #myBook[data-flip-style="slide"] .page.flipping {
            animation: slideFlip var(--flip-duration, 0.75s) cubic-bezier(0.22, 0.68, 0, 1) forwards;
        }
        #myBook[data-flip-style="slide"] .page.flipping-back {
            animation: slideFlipBack var(--flip-duration, 0.75s) cubic-bezier(0.22, 0.68, 0, 1) forwards;
        }
        #myBook[data-flip-style="fade"] .page.flipping {
            animation: fadeFlip var(--flip-duration, 0.6s) ease-in-out forwards;
        }
        #myBook[data-flip-style="fade"] .page.flipping-back {
            animation: fadeFlipBack var(--flip-duration, 0.6s) ease-in-out forwards;
        }
        #myBook[data-flip-style="quick"] .page.flipping {
            animation: quickFlip var(--flip-duration, 0.48s) cubic-bezier(0.35, 0, 0.2, 1) forwards;
        }
        #myBook[data-flip-style="quick"] .page.flipping-back {
            animation: quickFlipBack var(--flip-duration, 0.48s) cubic-bezier(0.35, 0, 0.2, 1) forwards;
        }
        .page.flipped-done { transform: rotateY(-180deg); opacity: 0; pointer-events: none; }
        .page.rewinding { animation: realisticFlipBack 0.32s ease-out forwards; }

        /* سلايدر مخصص */
        input[type="range"] { accent-color: #000; cursor: pointer; }
        .setting-item select {
            width: 150px;
            padding: 9px 10px;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 10px;
            background: #fff;
            color: #111;
            font: inherit;
            font-size: 13px;
        }
        @media (prefers-reduced-motion: reduce) {
            .page.flipping, .page.flipping-back { animation-duration: 0.25s !important; }
        }
        @media (max-width: 600px) {
            .nav-controls { padding: 0 14px; }
            .nav-btn { width: 48px; height: 48px; font-size: 22px; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div class="footer">
        تصميم وتطوير <a href="https://shadowdesign.sa/" target="_blank">شدو ديزاين</a>
    </div>

    <div class="settings-toggle" onclick="toggleSettings()">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.84,9.48l2.03,1.58C4.84,11.36,4.82,11.68,4.82,12c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.5c-1.93,0-3.5-1.57-3.5-3.5 s1.57-3.5,3.5-3.5s3.5,1.57,3.5,3.5S13.93,15.5,12,15.5z"/></svg>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3 style="margin-bottom: 20px;">إعدادات العرض</h3>
        <div class="setting-item">
            <label>التقليب التلقائي</label>
            <label class="switch">
                <input type="checkbox" id="autoFlipSwitch" checked onchange="toggleAutoFlip()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <label>سرعة العرض</label>
            <input type="range" id="speedRange" min="2000" max="8000" step="500" value="4000" oninput="updateSpeed(this.value)">
        </div>
        <div class="setting-item">
            <label for="flipStyle">نمط تقليب الصفحات</label>
            <select id="flipStyle" onchange="updateFlipStyle(this.value)">
                <option value="realistic">واقعي ثلاثي الأبعاد</option>
                <option value="classic">قلب كلاسيكي</option>
                <option value="slide">انزلاق هادئ</option>
                <option value="fade">تلاشي ناعم</option>
                <option value="quick">قلب سريع</option>
            </select>
        </div>
    </div>

    <div class="nav-controls" id="navControls">
        <div class="nav-btn" onclick="flipPrevPage()">→</div>
        <div class="nav-btn" onclick="flipNextPage()">←</div>
    </div>

    <div class="scene">
        <div class="book" id="myBook"></div>
    </div>

    <script>
        // التحكم في مؤشر الماوس المخصص
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        const config = {
            totalImages: 30,
            autoFlipDelay: 4000,
            rewindStagger: 60,
            defaultAspectRatio: 0.707,
            flipDurations: {
                realistic: 1200,
                classic: 1000,
                slide: 750,
                fade: 600,
                quick: 480
            }
        };

        const book = document.getElementById('myBook');
        const navControls = document.getElementById('navControls');
        let pages = [];
        let currentPage = 0;
        let pageAspectRatio = config.defaultAspectRatio;
        let autoFlipTimer = null;
        let isRewinding = false;
        let isAnimating = false;

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        function updateSpeed(val) {
            config.autoFlipDelay = Number.parseInt(val, 10);
            if (document.getElementById('autoFlipSwitch').checked && !isRewinding) startAutoLoop();
        }

        function updateFlipStyle(style) {
            if (!Object.prototype.hasOwnProperty.call(config.flipDurations, style)) return;
            book.dataset.flipStyle = style;
            book.style.setProperty('--flip-duration', `${config.flipDurations[style]}ms`);
        }

        function toggleAutoFlip() {
            const isAuto = document.getElementById('autoFlipSwitch').checked;
            if (isAuto) {
                navControls.style.display = 'none';
                startAutoLoop();
            } else {
                clearTimeout(autoFlipTimer);
                navControls.style.display = 'flex';
            }
        }

        function adjustBookDimensions() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const maxAllowedWidth = vw * 0.92;
            const maxAllowedHeight = vh * 0.85;
            let finalWidth = maxAllowedWidth;
            let finalHeight = finalWidth / pageAspectRatio;
            if (finalHeight > maxAllowedHeight) {
                finalHeight = maxAllowedHeight;
                finalWidth = finalHeight * pageAspectRatio;
            }
            book.style.width = `${Math.round(finalWidth)}px`;
            book.style.height = `${Math.round(finalHeight)}px`;
        }

        function detectImageAspectRatio() {
            const probeImg = new Image();
            probeImg.onload = function () {
                pageAspectRatio = this.naturalWidth / this.naturalHeight;
                adjustBookDimensions();
            };
            probeImg.src = `1.jpg`;
        }

        function initBook() {
            book.innerHTML = '';
            pages = [];
            for (let i = 0; i < config.totalImages; i++) {
                const pageNum = i + 1;
                const imgSrc = `${pageNum}.jpg`;
                const backImgSrc = `${Math.min(pageNum + 1, config.totalImages)}.jpg`;
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';
                pageDiv.style.zIndex = config.totalImages - i;
                pageDiv.innerHTML = `
                    <div class="page-face front">
                        <img src="${imgSrc}" alt="Page ${pageNum}">
                        <div class="spine-shadow"></div>
                        <div class="curl-lighting"></div>
                    </div>
                    <div class="page-face back">
                        <img src="${backImgSrc}" alt="">
                        <div class="curl-lighting"></div>
                    </div>
                `;
                book.appendChild(pageDiv);
                pages.push(pageDiv);
            }
            const styleSelect = document.getElementById('flipStyle');
            updateFlipStyle(styleSelect.value);
            adjustBookDimensions();
            detectImageAspectRatio();
            startAutoLoop();
        }

        function flipNextPage() {
            if (isRewinding || isAnimating) return;
            if (currentPage < config.totalImages) {
                const pageIndex = currentPage;
                const activePage = pages[pageIndex];
                activePage.style.zIndex = String(config.totalImages + 1);
                animatePage(activePage, 'flipping', () => {
                    activePage.classList.remove('flipping');
                    activePage.classList.add('flipped-done');
                    activePage.style.zIndex = String(pageIndex);
                    currentPage = pageIndex + 1;
                });
            } else {
                if (document.getElementById('autoFlipSwitch').checked) rewindToFirstPage();
            }
        }

        function flipPrevPage() {
            if (currentPage <= 0 || isRewinding || isAnimating) return;
            currentPage--;
            const prevPage = pages[currentPage];
            prevPage.style.zIndex = String(config.totalImages + 1);
            prevPage.classList.remove('flipped-done');
            animatePage(prevPage, 'flipping-back', () => {
                prevPage.classList.remove('flipping-back');
                prevPage.style.zIndex = String(config.totalImages - currentPage);
            });
        }

        function animatePage(page, animationClass, onComplete) {
            isAnimating = true;
            const onAnimationEnd = (event) => {
                if (event.target !== page) return;
                page.removeEventListener('animationend', onAnimationEnd);
                page.classList.remove(animationClass);
                isAnimating = false;
                onComplete();
            };
            page.addEventListener('animationend', onAnimationEnd);
            page.classList.add(animationClass);
        }

        function rewindToFirstPage() {
            if (isRewinding || isAnimating) return;
            clearTimeout(autoFlipTimer);
            isRewinding = true;
            let pageIndex = currentPage - 1;
            const rewindInterval = setInterval(() => {
                if (pageIndex >= 0) {
                    const p = pages[pageIndex];
                    p.classList.remove('flipping', 'flipped-done', 'flipping-back');
                    p.classList.add('rewinding');
                    p.style.zIndex = String(config.totalImages + pageIndex);
                    p.addEventListener('animationend', () => {
                        p.classList.remove('rewinding');
                        p.style.zIndex = String(config.totalImages - pageIndex);
                    }, { once: true });
                    pageIndex--;
                } else {
                    clearInterval(rewindInterval);
                    setTimeout(() => {
                        pages.forEach((page, index) => {
                            page.classList.remove('flipping', 'flipped-done', 'flipping-back', 'rewinding');
                            page.style.zIndex = String(config.totalImages - index);
                            page.style.transform = '';
                            page.style.opacity = '';
                        });
                        currentPage = 0;
                        isRewinding = false;
                        if (document.getElementById('autoFlipSwitch').checked) startAutoLoop();
                    }, 600);
                }
            }, config.rewindStagger);
        }

        function startAutoLoop() {
            clearTimeout(autoFlipTimer);
            if (!document.getElementById('autoFlipSwitch').checked || isRewinding) return;
            autoFlipTimer = setTimeout(() => {
                flipNextPage();
                startAutoLoop();
            }, config.autoFlipDelay);
        }

        window.addEventListener('resize', adjustBookDimensions);
        window.onload = initBook;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>
</html>
